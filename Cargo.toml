[package]
name = "mist-lang"
version = "0.0.5-alpha0"
edition = "2024"
description = "The Mist programming language compiler"
license = "Apache-2.0"
repository = "https://github.com/mist-go/mist"
readme = "README.md"
keywords = ["compiler", "language", "mist", "lang"]
categories = ["compilers", "command-line-interface", "development-tools", "development-tools::build-utils"]
default-run = "mist"
include = [
    ".mist/src/**",
    "Cargo.toml",
    "README.md",
]

[dependencies]
mist-parser = { workspace = true }
mist-analyzer = { workspace = true }
mist-codegen = { workspace = true }

serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
cargo_metadata = "0.23.1"

[workspace]
members = [
    "crates/parser",
    "crates/analyzer",
    "crates/codegen",
    "crates/mist-api",
]

exclude = [
    "mist-test",
]

[workspace.dependencies]
mist-parser = { path = "crates/parser", version = "0.1.6" }
mist-analyzer = { path = "crates/analyzer", version = "0.0.3" }
mist-codegen = { path = "crates/codegen", version = "0.1.2" }
mist-api = { path = "crates/mist-api", version = "0.1.0" }

[[bin]]
name = "mist"
path = ".mist/src/main.rs"

[[bin]]
name = "mist-lsp"
path = ".mist/lsp/main.rs"

[[bin]]
name = "mist-header"
path = "src/_header.rs"

[[bin]]
name = "mist-analyzer"
path = ".mist/src/analyzer.rs"
