[package]
name = "mist-lang"
version = "0.3.1-alpha.0"
edition = "2024"
description = "The Mist programming language compiler"
license = "Apache-2.0"
repository = "https://github.com/mist-go/mist"
readme = "README.md"
keywords = ["compiler", "language", "mist", "lang"]
categories = ["compilers", "command-line-interface", "development-tools", "development-tools::build-utils"]
default-run = "mist"
include = [
    ".mist/src/**",
    "Cargo.toml",
    "README.md",
]

[dependencies]
mist-analyzer = { workspace = true }
mist-api = { workspace = true }

[workspace]
members = [
    "crates/parser",
    "crates/analyzer",
    "crates/codegen",
    "crates/mist-api",
]

exclude = [
    "mist-test",
]

[workspace.dependencies]
mist-parser = { path = "crates/parser", version = "0.3.1-alpha.0" }
mist-analyzer = { path = "crates/analyzer", version = "0.1.7-alpha.1" }
mist-codegen = { path = "crates/codegen", version = "0.3.1-alpha.0" }
mist-api = { path = "crates/mist-api", version = "0.3.1-alpha.0" }

[[bin]]
name = "mist"
path = ".mist/src/main.rs"

[[bin]]
name = "mist-analyzer"
path = ".mist/src/analyzer.rs"
