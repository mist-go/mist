[package]
name = "mist-analyzer"
version = "0.0.2"
edition = "2024"
description = "The Mist programming language Analyzer LSP"
license = "Apache-2.0"
repository = "https://github.com/mist-go/mist"
keywords = ["language-server", "language", "mist"]
categories = ["compilers"]

[dependencies]
mist-parser = { workspace = true }
mist-codegen = { workspace = true }

dashmap = "6.1.0"
tokio = { version = "1.52.3", features = ["full", "macros", "rt", "rt-multi-thread"] }
tower-lsp = "0.20.0"
cargo_metadata = "0.23.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
